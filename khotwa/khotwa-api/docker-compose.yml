version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: khotwa-mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=khotwa

volumes:
  mongodb_data:
    name: khotwa-mongodb-data
